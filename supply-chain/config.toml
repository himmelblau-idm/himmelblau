[[exemptions.crypto-primes]]
version = "0.7.2"
criteria = "safe-to-deploy"
notes = """
Automated exemption, not certification, for crypto-primes 0.7.2; reviewed by codex. AI severity: MEDIUM; malicious: false. Findings remain unresolved and are accepted under --auto-exempt policy.

Reviewed all diff lines 1–9546 sequentially; no coverage gaps. The truncated 3601–3800 output was fully reread in smaller chunks. crypto-primes implements prime generation and Miller–Rabin/Lucas primality checks. No intentionally malicious behavior, unsafe blocks, build scripts, or unexpected runtime filesystem/network access found. Core dependencies are crypto-bigint and rand_core; Rayon is optional, and native comparison libraries are optional test dependencies. Documentation loads integrity-pinned KaTeX resources; benchmark filesystem access reads bundled vectors. Certification withheld for confirmed denial-of-service defects: (1) src/hazmat/gcd.rs:21–33 permits a zero remainder into binary_gcd, whose shift at line 53 panics with overflow checks and hangs in the tested optimized build. Public hazmat::lucas_test reaches this with a custom base P=1,Q=3 and candidate 55340232221128654851; Jacobi(-11,n)=-1, so the base satisfies the required discriminant condition. Exploitation requires an application using such a custom base and accepting attacker-controlled candidates; reachability with built-in bases was not established. (2) src/hazmat/miller_rabin.rs:229 and src/hazmat/float.rs:87 use unchecked arithmetic: minimum_mr_iterations(0,128) and (65537,128) panic in debug probes. Applications exposing these parameters can suffer availability failures. Probes used unchanged library source with a minimal harness and compatible cached crypto-bigint 0.7.11; the original full test suite was not run. Required follow-up: handle zero GCD operands, validate iteration-helper inputs, use overflow-safe square-root arithmetic, and add regression tests in debug and release configurations."""

