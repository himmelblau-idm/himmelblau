[[exemptions.wnaf]]
version = "0.14.1"
criteria = "safe-to-deploy"
notes = """
Automated exemption, not certification, for wnaf 0.14.1; reviewed by codex. AI severity: MEDIUM; malicious: false. Findings remain unresolved and are accepted under --auto-exempt policy.

Complete review of diff ranges 1–500, 501–1000, and 1001–1435, all read without truncation; no coverage gaps. wnaf implements generic variable-time elliptic-curve scalar and multiscalar multiplication, attributed to RustCrypto and adapted from group. No intentionally malicious behavior found. Certification is withheld for verified arithmetic defects.

1. src/scalar.rs:60–68 and src/lib.rs:178: reinitializing a WnafScalar with shorter bytes leaves old trailing digits, while wnaf_multi_exp reads the entire backing array rather than respecting each term's digit count. When another term is longer, stale digits contribute to the result. Running the extracted Rust routines in both debug and release configurations reproduced an expected 1G + 256G = 257G calculation yielding 513G after reinitializing the first scalar from 256 to 1. This requires scalar-buffer reuse followed by mixed-length multiscalar multiplication. Incorrect cryptographic arithmetic can affect verification or other protocol results; a concrete forgery was not established. Clear unused digits or enforce each term's logical length, and add regression coverage.

2. src/base.rs:66–69: WnafBase::default fills every table entry with the generator instead of its required odd multiples. With window 4, multiplying this publicly constructible base by scalar 3 returns G instead of 3G. Construct a valid generator table or remove Default.

3. src/lib.rs:70–126: supported windows 7 and 8 perform checked debug conversions of values exceeding i8::MAX. Window 7 with scalar 65 reproducibly panics because digit(width) attempts to convert 128. Input-controlled scalars can therefore cause availability failures in affected builds. Compute signed digits in a wider type before converting and test all supported windows.

The crate forbids unsafe code; the unsafe search found only that prohibition and a lint setting. Cargo.toml disables build scripts, and no runtime filesystem, network, process execution, or unexpected I/O appears. Direct dependencies are hybrid-array, ff, group, and primefield; their source is outside this review. The README correctly warns that variable-time operations must not receive secret scalars. Required follow-up: fix the arithmetic and conversion defects, add regression tests, and review the corrected crate before certification."""

