[[exemptions.x509-cert]]
version = "0.3.0"
criteria = "safe-to-deploy"
notes = """
Automated exemption, not certification, for x509-cert 0.3.0; reviewed by codex. AI severity: MEDIUM; malicious: false. Findings remain unresolved and are accepted under --auto-exempt policy.

Withhold certification for a confirmed revocation defect. In src/builder.rs, CrlBuilder::new_with_this_update copies the issuing certificate's AuthorityKeyIdentifier instead of its SubjectKeyIdentifier. For intermediate CAs with distinct parent keys, generated CRLs identify the parent key. An offline reproduction produced OpenSSL's 'unable to get certificate CRL'; correcting only the identifier and re-signing made verification pass. Impact: revocation-checking outages, or continued acceptance of revoked credentials if downstream applications tolerate unavailable CRLs. Use the signer's existing SKI, derive one only when absent, and add a distinct-key intermediate-CA regression test. This matches [RFC 5280 section 5.2.1](https://www.rfc-editor.org/rfc/rfc5280.html#section-5.2.1).
Additional bounded issues: src/builder/profile/cabf/tls.rs stores DomainValidated.names but never emits SubjectAltName, confirmed by reproduction; certificates can lose their intended identities and fail hostname validation. Other advertised subscriber types reach todo! in get_subject and panic if selected. Implement these paths or return explicit errors. In src/time.rs, Validity encoding changes accepted GeneralizedTime dates into UTCTime; reproduction confirmed changed bytes, which can invalidate existing signatures when parsed certificates are re-encoded. Preserve parsed encodings or explicitly address verification and hashing compatibility.
No intentional malicious behavior, added unsafe code, unexpected production I/O, privilege changes, or git/path production dependencies found. Cargo.toml disables build scripts.
Coverage: reviewed lines 1-8000 in consecutive, separate 500-line ranges, then 8001-8304, including the final unterminated line. No truncation or coverage gaps."""

