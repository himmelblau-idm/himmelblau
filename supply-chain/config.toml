[[exemptions.cts]]
version = "0.7.0"
criteria = "safe-to-deploy"
notes = """
Automated exemption, not certification, for cts 0.7.0; reviewed by codex. AI severity: MEDIUM; malicious: false. Findings remain unresolved and are accepted under --auto-exempt policy.

Reviewed all supplied content sequentially: diff lines 1–400, 401–800, 801–1200, 1201–1600, and 1601–1916, without truncation. No coverage gaps; the last line lacks a newline. This RustCrypto crate implements six CBC/ECB ciphertext-stealing modes. No unsafe code, build script, unexpected filesystem/network access, or malicious behavior was found. Cargo.toml forbids unsafe code and disables build scripts. The sole runtime dependency is cipher; AES, belt-block, and hex-literal are development dependencies. Buffer length checks and shared serial/parallel helpers appear sound for valid cipher implementations. Medium finding: src/cbc_cs3.rs, encryption closure at line 73 and decryption closure, mishandles exactly one block. Encryption computes E_K(E_K(P XOR IV)); decryption applies two decryptions. RFC 3962 specifies one AES operation for this case ([RFC 3962 section 5](https://www.rfc-editor.org/rfc/rfc3962.html#section-5)). Reproduced with zero AES-128 key, IV, and plaintext: expected 66e94bd4ef8a2c3b884cfa59ca342b2e, actual f795bd4a52e29ed713d313fa20e98dbc. Standard ciphertext also decrypts incorrectly. Impact is bounded interoperability failure and incorrect plaintext when applications accept exactly one-block messages; no key recovery or memory corruption was demonstrated. EcbCs3 has the analogous double-operation branch. All eight supplied integration tests and two doctests passed; an added independent one-block interoperability test failed. Existing round-trip tests conceal the CBC defect because encryption and decryption share it. Certification is withheld pending correction or explicit rejection of the one-block case, with independent known-answer regression tests."""

