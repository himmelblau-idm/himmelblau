[[exemptions.scrypt]]
version = "0.12.0"
criteria = "safe-to-deploy"
notes = """
Automated exemption, not certification, for scrypt 0.12.0; reviewed by codex. AI severity: MEDIUM; malicious: false. Findings remain unresolved and are accepted under --auto-exempt policy.

Completed sequential review of diff lines 1-500, 501-1000, 1001-1500, 1501-2000, 2001-2500, and 2501-2796 without truncation; no coverage gaps. The final line lacks a terminating newline. This is RustCrypto's established scrypt password hashing/key derivation implementation. No intentionally malicious behavior, unexpected filesystem/network access, or build script was found; Cargo.toml explicitly sets build=false. Dependencies comprise cfg-if, pbkdf2, salsa20, sha2, and optional password-hash, ctutils, kdf, mcf, and rayon; dependency implementations are outside this review. Unsafe SSE2/Wasm SIMD operations have valid bounds through current internal callers and compile-time CPU-feature gating.
Medium finding: src/params.rs:99 checks the parameter bound using unchecked u32 multiplication, r * p. An isolated reproduction using the supplied Params implementation confirmed that Params::new(1, 65536, 65536) panics with overflow checks enabled and incorrectly returns Ok with checks disabled. Attacker-controlled PHC/MCF parameters can reach this constructor. Impact includes request/task termination or process termination depending on panic policy; accepted parameters can subsequently request a 512 GiB allocation and terminate the process on allocation failure. Exploitation requires control of parameters passed to construction or hash verification. Replace multiplication with checked or widened arithmetic and add regression coverage before certification.
Additional low-impact correctness concern: src/romix.rs:14 reads only 32 bits for Integerify although Params permits log_n greater than 32. Such configurations select only the first 2^32 entries during the second ROMix pass, departing from scrypt; exploitation requires impractically large working memory. Restrict supported N or implement wider Integerify. Verification also requires application limits on untrusted work factors because allocations and CPU costs are intentionally parameter-driven. Approval is withheld pending resolution of the parameter-validation defect and extreme-N correctness concern."""

