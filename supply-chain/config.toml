[[exemptions.elliptic-curve]]
version = "0.14.3"
criteria = "safe-to-deploy"
notes = """
Automated exemption, not certification, for elliptic-curve 0.14.3; reviewed by codex. AI severity: MEDIUM; malicious: false. Findings remain unresolved and are accepted under --auto-exempt policy.

Withhold certification for two regressions. (1) Medium: src/sec1.rs, ToSec1Point::to_compressed_point and to_uncompressed_point copy the SEC1 encoding into fixed-size arrays using copy_from_slice. The valid identity encoding is one byte, so serializing an identity point panics. An attacker can cause denial of service if an application accepts identity points through FromSec1Point::from_sec1_bytes and invokes these helpers without containing panics; panic=abort terminates the process. Return a fallible result or explicitly handle identity, and add regression tests. PublicKey separately rejects identity. (2) Low: src/secret_key.rs, Generate for SecretKey directly wraps ScalarValue::try_generate_from_rng, which samples modulo ORDER and permits zero. Previously generation used NonZeroScalar rejection sampling. This violates the nonzero invariant assumed by to_nonzero_scalar and public-key/ECDH operations. Probability is negligible with a normal secure RNG, but the invariant should be restored by rejecting zero and tested with a controlled RNG. The four added unsafe casts use repr(transparent) wrappers and preserve shared borrowing, alignment, lengths, and lifetimes; no memory-safety issue identified. Manifest dependencies use registry sources, build scripts are disabled, and no malicious behavior, unexpected filesystem/network/process activity, or privilege changes were found. Reviewed sequential diff ranges: 1–500, 501–1000, 1001–1500, 1501–2000, 2001–2500, 2501–3000, 3001–3500, 3501–4000, 4001–4250, 4251–4500, 4501–5000, 5001–5500, 5501–6000, 6001–6500, 6501–7000, 7001–7500, 7501–8000, 8001–8500, 8501–9000, and 9001–9444. The truncated 4001–4500 output was reread successfully in smaller ranges. Coverage gaps: none. Findings are from static review; executable regression tests remain required."""

