criteria = "safe-to-deploy"
notes = "This is a cargo-vet exemption for pkcs1 0.8.0, not certification. Unresolved moderate-risk concerns include heap-backed private-key values and decoding temporaries that are not zeroized, even with the zeroize feature enabled, leaving recoverable secrets after decoding, cloning, and failed parses if memory is disclosed or released memory is accessed. The review covered the full supplied diff without truncation and inspected relevant der storage and decoder behavior, but tests were inspected rather than executed."

[[exemptions.pkcs5]]
version = "0.8.1"
criteria = "safe-to-deploy"
notes = """
Automated exemption, not certification, for pkcs5 0.8.1; reviewed by codex. AI severity: MEDIUM; malicious: false. Findings remain unresolved and are accepted under --auto-exempt policy.

Withhold certification: confirmed denial-of-service defects, with no evidence of intentional malicious behavior. pkcs5 implements password-based key derivation, encryption, and ASN.1 encoding within the established RustCrypto project (https://github.com/RustCrypto/formats). Findings: (1) src/pbes2.rs:546,552 slices IVs before validating length; attacker-supplied DER containing a short DES/3DES IV panics when the corresponding feature is enabled. (2) src/pbes2/kdf.rs:512 computes log2 before rejecting zero; a decoded scrypt cost of zero panics during parameter conversion or decryption with pbes2 enabled. (3) src/pbes2/kdf/salt.rs:22-30 accepts a salt longer than 32 bytes and panics while copying; exploitation requires untrusted salt bytes reaching this public constructor or its callers. DER salt decoding separately checks length. (4) src/pbes2/encryption.rs:64-73 accepts excess buffer space but copies the GCM tag into the entire remaining slice, causing a panic unless exactly 16 bytes remain; exploitation requires influence over plaintext position or buffer sizing in an encryption caller. These panics can terminate requests, worker threads, or processes depending on panic handling. (5) src/pbes2/kdf.rs:284 decodes iteration counts without enforcing MAX_ITERATION_COUNT; decryption forwards them to PBKDF2. Scrypt similarly lacks an operational resource budget, allowing excessive memory/CPU use when applications decrypt attacker-controlled parameters without prior limits. Four panic reproductions and the iteration-limit bypass were confirmed in debug and release builds; all 15 existing tests passed. No unsafe blocks: src/lib.rs forbids unsafe code. Cargo.toml disables build scripts. Dependencies are der/spki plus optional AES, AES-GCM, CBC, PBKDF2, scrypt, SHA, DES, and RNG crates; hex-literal is test-only. No unexpected production network/filesystem access was found; filesystem operations and OpenSSL commands are confined to tests and the manual fixture-generation script. Derived keys are not explicitly zeroized, a lower-severity residual-memory concern. Required follow-up: reject malformed parameters before indexing/arithmetic, correct GCM buffer bounds, enforce KDF resource limits, and add regression coverage before reassessment. Reviewed sequential diff ranges 1-500, 501-1000, 1001-1500, 1501-2000, 2001-2500, 2501-3000, 3001-3500, 3501-4000, and 4001-4005 without truncation; no supplied-text coverage gaps. Binary fixture bodies omitted by the diff and transitive dependency internals are outside the complete supplied-text coverage claim."""

