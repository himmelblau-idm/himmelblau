[[exemptions.aes-kw]]
version = "0.3.1"
criteria = "safe-to-deploy"
notes = "This is a cargo-vet exemption for aes-kw 0.3.1, not certification. The review reports unresolved empty-output authentication bypasses, uninitialized KWP padding that can cause failures and potentially disclose stale buffer contents, and an input-dependent panic that can cause denial of service. Review was static with no runtime tests; although both supplied batches were fully read, one omitted security-critical implementation and manifest context, dependency implementations were not audited, and integrated behavior remains unvalidated."

[[exemptions.ar_archive_writer]]
version = "0.5.5"
criteria = "safe-to-deploy"
notes = """
Automated exemption, not certification, for ar_archive_writer 0.5.5; reviewed by codex. AI severity: MEDIUM; malicious: false. Findings remain unresolved and are accepted under --auto-exempt policy.

Complete source review; certification withheld for confirmed input-triggered denial of service. ar_archive_writer writes object-file archives and COFF import libraries; its README describes an LLVM port and its manifest identifies the rust-lang repository. In src/coff_import_file.rs:59, ARM64EC import symbols undergo from_utf8(name).unwrap(); empty symbols reach another unwrap in src/mangler.rs:48. Minimal crafted import objects reproduced both panics through write_archive_to_stream with DEFAULT_OBJECT_READER. Exploitation requires supplying object bytes to an application using this API; uncaught panics terminate the operation, or the process with panic=abort. Additional malformed-symbol handling uses expect in src/object_reader.rs:41. Return InvalidData errors and add malformed-input regression tests before certification. No unsafe code, backdoors, exfiltration, network operations, or unexpected production filesystem access were found. Output goes to caller-provided streams; filesystem operations and LLVM subprocesses are confined to tests. Cargo.toml disables build scripts; object 0.39 is the sole runtime dependency, while cargo-binutils and pretty_assertions are development dependencies. Dependency implementation review was outside the supplied content. Reviewed sequential diff ranges 1–500, 501–1000, 1001–1500, 1501–2000, 2001–2500, 2501–3000, 3001–3500, 3501–4000, 4001–4500, 4501–5000, and 5001–5445 without truncation; no supplied-content coverage gaps. The final line lacks a newline. Reproducers ran against extracted source with development dependencies removed; the full upstream test suite was not run."""

