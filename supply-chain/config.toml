[[exemptions.pest_meta]]
version = "2.9.6"
criteria = "safe-to-deploy"
notes = """
Automated exemption, not certification, for pest_meta 2.9.6; reviewed by codex. AI severity: MEDIUM; malicious: false. Findings remain unresolved and are accepted under --auto-exempt policy.

Reviewed all diff lines 1–9005 sequentially in ranges of at most 500 lines. Truncated reads were replaced by complete smaller reads, including all 48,260 characters of line 1869. Coverage gaps: none. pest_meta parses, validates, and optimizes pest grammar definitions. No intentionally malicious behavior, unsafe blocks, runtime network/filesystem access, or build script was found. Cargo.toml declares only pest; its transitive dependencies include native stack-support libraries and compiler tooling. Medium-risk availability findings prevent certification: src/parser.rs:426,435 unwrap out-of-range PEEK integers; src/parser.rs:449 and related literal conversions panic on invalid Unicode scalar escapes. Both were reproduced through parse_and_optimize in debug and release builds with a 5,000-call parser limit. src/optimizer/unroller.rs:20–63 expands attacker-controlled repetition bounds without an allocation budget and uses overflowing arithmetic. The tiny grammar r = { "a"{4294967295} } reproducibly panics in both builds; other large bounds can exhaust memory or stack. Exploitation requires control over grammar definitions reaching these APIs, rather than merely input parsed by a fixed application grammar. Trusted build-time grammars substantially reduce exposure, but that restriction is not established here. Required follow-up: return validation errors for invalid integers and Unicode, enforce checked repetition and AST expansion budgets, or establish that all grammar definitions are trusted and processing is contained. Dependency internals were not independently audited."""

