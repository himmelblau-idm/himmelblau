notes = """
Automated exemption, not certification, for sha1 0.11.0; reviewed by codex. AI severity: MEDIUM; malicious: false. Findings remain unresolved and are accepted under --auto-exempt policy.

Reviewed all supplied diff lines sequentially: 1–400, 401–800, and 801–1239 through EOF, without truncation or coverage gaps. Found a conditional denial-of-service issue in src/block_api.rs: deserialize accepts arbitrary block_len values, while finalize_fixed_core computes the bit length using ordinary multiplication. Reproduced an overflow panic by setting serialized state bytes 20–27 to 0xff and calling Sha1::deserialize followed by finalize. Exploitation requires attacker-controlled state restoration, overflow checks enabled, and an uncaught panic; process termination depends on application panic handling. Withholding certification pending rejection of excessive counters or appropriate wrapping arithmetic, with regression coverage. Standard integration tests and doctests passed. Reviewed backend dispatch and surrounding unsafe implementations; no additional memory-safety concern or malicious behavior identified. Manifest changes introduce no git/path dependencies or build script, and no unexpected filesystem, network, process, or privilege operations were found. SHA-1's documented collision weakness is pre-existing. Architecture execution testing was limited to the host; binary fixture payloads were not included in the supplied textual diff."""

