[[exemptions.aes]]
version = "0.9.4"
criteria = "safe-to-deploy"
notes = """
Automated exemption, not certification, for aes 0.9.4; reviewed by codex. AI severity: MEDIUM; malicious: false. Findings remain unresolved and are accepted under --auto-exempt policy.

Reviewed diff lines 1-11000 in 22 consecutive 500-line ranges, then 11001-11052, without truncation. No supplied-text coverage gaps; binary test fixtures appeared only as change notices. No malicious behavior, filesystem/network/process operations, privilege changes, build scripts, or git/path dependencies were introduced.
Medium concern: src/lib.rs:147-149 detects VAES independently of AES and AVX2. Initialization at src/lib.rs:229 selects hardware key storage only when AES is detected, but encryption/decryption at src/lib.rs:261-273 and 311-323 select VAES without checking that invariant. The inspected cpufeatures 0.3.1 implementation does not enforce these feature dependencies. A VM exposing VAES while masking AES can therefore interpret software keys as hardware keys; combined-cipher decryption can read uninitialized union storage. Missing instruction support can also cause termination. This requires an unusual CPU feature configuration, not merely attacker-controlled plaintext. Rust documents that VAES target functions require AES and AVX2: [Rust Reference](https://doc.rust-lang.org/reference/attributes/codegen.html).
Require AES and AVX2 in both VAES detection predicates, plus AVX512F for the 512-bit backend, and validate feature-masked configurations before certification. Native, forced-software, and compact-software all-feature tests each passed 17 tests; these do not resolve the dispatch concern. ARM and VAES execution were not validated."""

[[exemptions.aes-gcm]]
