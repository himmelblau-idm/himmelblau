[package]
name = "rsa"
version = "0.9.10"
authors.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = ["rsa/default"]
getrandom = ["rsa/getrandom"]
hazmat = ["rsa/hazmat"]
nightly = []
pem = []
pkcs5 = ["rsa/pkcs5"]
serde = ["rsa/serde"]
std = []
u64_digit = []

[dependencies]
rsa = { version = "0.10.0-rc.19" }
rand_core_legacy = { package = "rand_core", version = "0.6", features = ["std"] }
sha2_legacy = { package = "sha2", version = "0.10", features = ["oid"] }
