---
name: Stable maintenance branch pipeline
on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
jobs:
  dependencies:
    uses: ./.github/workflows/stable-maintenance-stage.yml
    with:
      branch: ${{ inputs.branch }}
      stage: dependencies
    secrets: inherit

  vet:
    needs: [dependencies]
    # Attempt later stages after failure; use the newest available checkpoint.
    if: ${{ always() && !cancelled() && !contains(needs.*.outputs.proceed, 'false') }}
    uses: ./.github/workflows/stable-maintenance-stage.yml
    with:
      branch: ${{ inputs.branch }}
      stage: vet
      failure-cooldowns: ${{ needs.dependencies.outputs.network-not-before }}
      previous-stage: ${{ (needs.dependencies.outputs.ref != '' && 'dependencies') || '' }}
      checkpoint-head: ${{ needs.dependencies.outputs.head || '' }}
      checkpoint-digest: ${{ needs.dependencies.outputs.digest || '' }}
      checkpoint-ref: ${{ needs.dependencies.outputs.ref || '' }}
      checkpoint-artifact: ${{ needs.dependencies.outputs.artifact || '' }}
    secrets: inherit

  backports-1:
    needs: [dependencies, vet]
    if: ${{ always() && !cancelled() && !contains(needs.*.outputs.proceed, 'false') }}
    uses: ./.github/workflows/stable-maintenance-stage.yml
    with:
      branch: ${{ inputs.branch }}
      stage: backports-1
      failure-cooldowns: ${{ needs.dependencies.outputs.network-not-before }},${{ needs.vet.outputs.network-not-before }}
      previous-stage: ${{ (needs.vet.outputs.ref != '' && 'vet') || (needs.dependencies.outputs.ref != '' && 'dependencies') || '' }}
      checkpoint-head: ${{ needs.vet.outputs.head || needs.dependencies.outputs.head || '' }}
      checkpoint-digest: ${{ needs.vet.outputs.digest || needs.dependencies.outputs.digest || '' }}
      checkpoint-ref: ${{ needs.vet.outputs.ref || needs.dependencies.outputs.ref || '' }}
      checkpoint-artifact: ${{ needs.vet.outputs.artifact || needs.dependencies.outputs.artifact || '' }}
    secrets: inherit

  backports-2:
    needs: [dependencies, vet, backports-1]
    if: ${{ always() && !cancelled() && !contains(needs.*.outputs.proceed, 'false') }}
    uses: ./.github/workflows/stable-maintenance-stage.yml
    with:
      branch: ${{ inputs.branch }}
      stage: backports-2
      failure-cooldowns: ${{ needs.dependencies.outputs.network-not-before }},${{ needs.vet.outputs.network-not-before }},${{ needs.backports-1.outputs.network-not-before }}
      previous-stage: ${{ (needs.backports-1.outputs.ref != '' && 'backports-1') || (needs.vet.outputs.ref != '' && 'vet') || (needs.dependencies.outputs.ref != '' && 'dependencies') || '' }}
      checkpoint-head: ${{ needs.backports-1.outputs.head || needs.vet.outputs.head || needs.dependencies.outputs.head || '' }}
      checkpoint-digest: ${{ needs.backports-1.outputs.digest || needs.vet.outputs.digest || needs.dependencies.outputs.digest || '' }}
      checkpoint-ref: ${{ needs.backports-1.outputs.ref || needs.vet.outputs.ref || needs.dependencies.outputs.ref || '' }}
      checkpoint-artifact: ${{ needs.backports-1.outputs.artifact || needs.vet.outputs.artifact || needs.dependencies.outputs.artifact || '' }}
    secrets: inherit

  backports-3:
    needs: [dependencies, vet, backports-1, backports-2]
    if: ${{ always() && !cancelled() && !contains(needs.*.outputs.proceed, 'false') }}
    uses: ./.github/workflows/stable-maintenance-stage.yml
    with:
      branch: ${{ inputs.branch }}
      stage: backports-3
      failure-cooldowns: ${{ needs.dependencies.outputs.network-not-before }},${{ needs.vet.outputs.network-not-before }},${{ needs.backports-1.outputs.network-not-before }},${{ needs.backports-2.outputs.network-not-before }}
      previous-stage: ${{ (needs.backports-2.outputs.ref != '' && 'backports-2') || (needs.backports-1.outputs.ref != '' && 'backports-1') || (needs.vet.outputs.ref != '' && 'vet') || (needs.dependencies.outputs.ref != '' && 'dependencies') || '' }}
      checkpoint-head: ${{ needs.backports-2.outputs.head || needs.backports-1.outputs.head || needs.vet.outputs.head || needs.dependencies.outputs.head || '' }}
      checkpoint-digest: ${{ needs.backports-2.outputs.digest || needs.backports-1.outputs.digest || needs.vet.outputs.digest || needs.dependencies.outputs.digest || '' }}
      checkpoint-ref: ${{ needs.backports-2.outputs.ref || needs.backports-1.outputs.ref || needs.vet.outputs.ref || needs.dependencies.outputs.ref || '' }}
      checkpoint-artifact: ${{ needs.backports-2.outputs.artifact || needs.backports-1.outputs.artifact || needs.vet.outputs.artifact || needs.dependencies.outputs.artifact || '' }}
    secrets: inherit

  backports-4:
    needs: [dependencies, vet, backports-1, backports-2, backports-3]
    if: ${{ always() && !cancelled() && !contains(needs.*.outputs.proceed, 'false') }}
    uses: ./.github/workflows/stable-maintenance-stage.yml
    with:
      branch: ${{ inputs.branch }}
      stage: backports-4
      failure-cooldowns: ${{ needs.dependencies.outputs.network-not-before }},${{ needs.vet.outputs.network-not-before }},${{ needs.backports-1.outputs.network-not-before }},${{ needs.backports-2.outputs.network-not-before }},${{ needs.backports-3.outputs.network-not-before }}
      previous-stage: ${{ (needs.backports-3.outputs.ref != '' && 'backports-3') || (needs.backports-2.outputs.ref != '' && 'backports-2') || (needs.backports-1.outputs.ref != '' && 'backports-1') || (needs.vet.outputs.ref != '' && 'vet') || (needs.dependencies.outputs.ref != '' && 'dependencies') || '' }}
      checkpoint-head: ${{ needs.backports-3.outputs.head || needs.backports-2.outputs.head || needs.backports-1.outputs.head || needs.vet.outputs.head || needs.dependencies.outputs.head || '' }}
      checkpoint-digest: ${{ needs.backports-3.outputs.digest || needs.backports-2.outputs.digest || needs.backports-1.outputs.digest || needs.vet.outputs.digest || needs.dependencies.outputs.digest || '' }}
      checkpoint-ref: ${{ needs.backports-3.outputs.ref || needs.backports-2.outputs.ref || needs.backports-1.outputs.ref || needs.vet.outputs.ref || needs.dependencies.outputs.ref || '' }}
      checkpoint-artifact: ${{ needs.backports-3.outputs.artifact || needs.backports-2.outputs.artifact || needs.backports-1.outputs.artifact || needs.vet.outputs.artifact || needs.dependencies.outputs.artifact || '' }}
    secrets: inherit

  final:
    needs: [dependencies, vet, backports-1, backports-2, backports-3, backports-4]
    if: ${{ always() && !cancelled() && !contains(needs.*.outputs.proceed, 'false') }}
    uses: ./.github/workflows/stable-maintenance-stage.yml
    with:
      branch: ${{ inputs.branch }}
      stage: final
      failure-cooldowns: ${{ needs.dependencies.outputs.network-not-before }},${{ needs.vet.outputs.network-not-before }},${{ needs.backports-1.outputs.network-not-before }},${{ needs.backports-2.outputs.network-not-before }},${{ needs.backports-3.outputs.network-not-before }},${{ needs.backports-4.outputs.network-not-before }}
      incomplete-stages: "${{ needs.dependencies.outputs.ref == '' && 'dependencies,' || '' }}${{ needs.vet.outputs.ref == '' && 'vet,' || '' }}${{ needs.backports-1.outputs.ref == '' && 'backports-1,' || '' }}${{ needs.backports-2.outputs.ref == '' && 'backports-2,' || '' }}${{ needs.backports-3.outputs.ref == '' && 'backports-3,' || '' }}${{ needs.backports-4.outputs.ref == '' && 'backports-4,' || '' }}"
      previous-stage: ${{ (needs.backports-4.outputs.ref != '' && 'backports-4') || (needs.backports-3.outputs.ref != '' && 'backports-3') || (needs.backports-2.outputs.ref != '' && 'backports-2') || (needs.backports-1.outputs.ref != '' && 'backports-1') || (needs.vet.outputs.ref != '' && 'vet') || (needs.dependencies.outputs.ref != '' && 'dependencies') || '' }}
      checkpoint-head: ${{ needs.backports-4.outputs.head || needs.backports-3.outputs.head || needs.backports-2.outputs.head || needs.backports-1.outputs.head || needs.vet.outputs.head || needs.dependencies.outputs.head || '' }}
      checkpoint-digest: ${{ needs.backports-4.outputs.digest || needs.backports-3.outputs.digest || needs.backports-2.outputs.digest || needs.backports-1.outputs.digest || needs.vet.outputs.digest || needs.dependencies.outputs.digest || '' }}
      checkpoint-ref: ${{ needs.backports-4.outputs.ref || needs.backports-3.outputs.ref || needs.backports-2.outputs.ref || needs.backports-1.outputs.ref || needs.vet.outputs.ref || needs.dependencies.outputs.ref || '' }}
      checkpoint-artifact: ${{ needs.backports-4.outputs.artifact || needs.backports-3.outputs.artifact || needs.backports-2.outputs.artifact || needs.backports-1.outputs.artifact || needs.vet.outputs.artifact || needs.dependencies.outputs.artifact || '' }}
    secrets: inherit
