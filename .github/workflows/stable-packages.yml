name: Check cache, build and publish missing stable packages
run-name: Stable packages ${{ inputs.tag || github.event.release.tag_name || github.event.client_payload.tag || github.ref_name }}

on:
  release:
    types: [published]
  repository_dispatch:
    types: [stable-packages]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (for example 4.0.2)
        required: true
        type: string
      distro:
        description: Makefile distro target (for example ubuntu24.04), or all
        default: all
        type: string
      revision:
        description: Optional source commit, branch or tag; defaults to the release tag
        type: string
      architecture:
        description: Architecture to build
        default: all
        type: choice
        options: [all, amd64, arm64]
      refresh_build_container:
        description: Refresh build-container dependencies for missing targets; existing Cloudsmith packages are preserved
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: stable-packages-${{ inputs.tag || github.event.release.tag_name || github.event.client_payload.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'himmelblau-idm/himmelblau' &&
      (github.event_name != 'workflow_dispatch' ||
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) &&
      (github.event_name != 'release' || !github.event.release.prerelease)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      enabled: ${{ steps.prepare.outputs.enabled }}
      matrix: ${{ steps.ddis.outputs.matrix }}
      tooling_sha: ${{ steps.prepare.outputs.tooling_sha }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - name: Checkout trusted release tooling and repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run stable publishing unit tests
        run: python3 .github/scripts/test_stable_packages.py
      - name: Validate release and select build targets
        id: prepare
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.event.client_payload.tag }}
          REQUESTED_REVISION: ${{ inputs.revision }}
          REQUESTED_DISTRO: ${{ inputs.distro }}
          REQUESTED_ARCHITECTURE: ${{ inputs.architecture }}
        run: python3 .github/scripts/stable_packages.py prepare
      - name: Pair native package targets with their DDIs
        id: ddis
        if: steps.prepare.outputs.enabled == 'true'
        env:
          DDI_CHANNEL: stable
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
          REQUESTED_REVISION: ${{ steps.prepare.outputs.source_sha }}
          REQUESTED_DISTRO: ${{ inputs.distro }}
          REQUESTED_ARCHITECTURE: ${{ inputs.architecture }}
          DDI_PACKAGE_MATRIX: ${{ steps.prepare.outputs.matrix }}
        run: python3 .github/scripts/ddi.py prepare

  targets:
    name: ${{ fromJSON(matrix.ddi_spec).distro }} ${{ fromJSON(matrix.ddi_spec).architecture }}
    permissions:
      contents: read
      packages: write
    needs: prepare
    if: needs.prepare.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/stable-package-target.yml
    with:
      spec: ${{ matrix.spec }}
      ddi_spec: ${{ matrix.ddi_spec }}
      publish_packages: ${{ matrix.publish_packages }}
      tooling_sha: ${{ needs.prepare.outputs.tooling_sha }}
      refresh_build_container: ${{ inputs.refresh_build_container || false }}
    secrets:
      CLOUDSMITH_PACKAGE_PUBLISHER: ${{ secrets.CLOUDSMITH_PACKAGE_PUBLISHER }}
      PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
      PACKAGE_SIGNING_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
      SCC_EMAIL: ${{ secrets.SCC_EMAIL }}
      SCC_REGCODE: ${{ secrets.SCC_REGCODE }}
